# Mihomo / Clash.MD 通用配置。Apple Packet Tunnel 由客户端管理；不设置桌面 TUN 路由。
# 无内置节点的公共模板请先添加节点，或在本地副本中配置自己的节点。
mode: rule
log-level: warning
ipv6: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.ts.net
  - localhost
  default-nameserver:
  - 223.5.5.5
  - 1.1.1.1
  nameserver: &id001
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver: *id001
proxies: []
proxy-groups:
- name: Guard
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: Proxies
  type: select
  proxies:
  - REJECT
- name: AI
  type: select
  proxies:
  - Proxies
- name: Netflix
  type: select
  proxies:
  - Proxies
- name: Apple
  type: select
  proxies:
  - DIRECT
  - Proxies
- name: Bilibili
  type: select
  proxies:
  - DIRECT
  - Proxies
- name: Copilot
  type: select
  proxies:
  - DIRECT
  - Proxies
rule-providers:
  AdvertisingLite-domain:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/5c22b5056f6288c27935489f74f8681fadbdba87/rule/Clash/AdvertisingLite/AdvertisingLite_Domain.yaml
