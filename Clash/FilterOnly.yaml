# Mihomo / Clash.MD 通用配置。Apple Packet Tunnel 由客户端管理；不设置桌面 TUN 路由。
# 无内置节点的公共模板请先添加节点，或在本地副本中配置自己的节点。
mode: rule
log-level: warning
ipv6: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.ts.net
  - localhost
  default-nameserver:
  - 223.5.5.5
  - 1.1.1.1
  nameserver: &id001
  - https://cloudflare-dns.com/dns-query
  - https://dns.google/dns-query
  proxy-server-nameserver: *id001
proxies: []
proxy-groups:
- name: Guard
  type: select
  proxies:
  - REJECT
  - DIRECT
rule-providers:
  AdvertisingLite-domain:
    type: http
    behavior: domain
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/5c22b5056f6288c27935489f74f8681fadbdba87/rule/Clash/AdvertisingLite/AdvertisingLite_Domain.yaml
    path: ./rules/AdvertisingLite-domain-5c22b5056f62.yaml
    interval: 86400
  AdvertisingLite-classical:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/5c22b5056f6288c27935489f74f8681fadbdba87/rule/Clash/AdvertisingLite/AdvertisingLite.yaml
    path: ./rules/AdvertisingLite-classical-5c22b5056f62.yaml
    interval: 86400
  Hijacking-classical:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/5c22b5056f6288c27935489f74f8681fadbdba87/rule/Clash/Hijacking/Hijacking.yaml
    path: ./rules/Hijacking-classical-5c22b5056f62.yaml
    interval: 86400
rules:
- DOMAIN-SUFFIX,local,DIRECT
- DOMAIN-SUFFIX,lan,DIRECT
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
- IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
- IP-CIDR6,::1/128,DIRECT,no-resolve
- IP-CIDR6,fc00::/7,DIRECT,no-resolve
- IP-CIDR6,fe80::/10,DIRECT,no-resolve
- DOMAIN,captive.apple.com,DIRECT
- RULE-SET,AdvertisingLite-domain,Guard
- RULE-SET,AdvertisingLite-classical,Guard,no-resolve
- RULE-SET,Hijacking-classical,Guard,no-resolve
- MATCH,DIRECT
